name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x -S warning lib/*.sh scripts/*.sh run-demo.sh

      - name: bash -n syntax check
        run: |
          set -euo pipefail
          for f in lib/*.sh scripts/*.sh run-demo.sh; do
            bash -n "$f"
          done
